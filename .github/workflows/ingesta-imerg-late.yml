name: Descargar GPM IMERG Late — puntos Argentina

on:
  push:
    branches:
      - "data/initial-radiosonde-inventory-2026-11-07"
    paths:
      - ".github/workflows/ingesta-imerg-late.yml"
      - "scripts/descargar_imerg_late_puntos.py"
      - "scripts/push_branch_retry.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingesta-imerg-late
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout rama aislada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente HTTP
        run: python -m pip install --upgrade requests

      - name: Descargar IMERG Late V07 y agregar a diario
        run: python scripts/descargar_imerg_late_puntos.py

      - name: Revisar productos
        if: always()
        run: |
          du -sh datos/fuentes-externas/precipitacion/gpm-imerg 2>/dev/null || true
          find datos/fuentes-externas/precipitacion/gpm-imerg -type f -printf '%s %p\n' | sort -nr | head -40 || true

      - name: Guardar series y manifiesto
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d datos/fuentes-externas/precipitacion/gpm-imerg ]; then
            git add datos/fuentes-externas/precipitacion/gpm-imerg
          fi
          if git diff --cached --quiet; then
            echo "No hay nuevos datos IMERG para guardar."
          else
            git commit -m "data: archive IMERG Late daily station series"
            bash scripts/push_branch_retry.sh
          fi
