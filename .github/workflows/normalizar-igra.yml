name: Normalizar inventario IGRA

on:
  push:
    branches:
      - "data/initial-radiosonde-inventory-2026-11-07"
    paths:
      - ".github/workflows/normalizar-igra.yml"
      - "scripts/normalizar_igra.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalizar-igra
  cancel-in-progress: false

jobs:
  normalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rama aislada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalizar inventario
        run: python scripts/normalizar_igra.py

      - name: Guardar inventarios
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/fuentes-externas/radiosondeos/igra
          git commit -m "data: publish normalized IGRA station inventories"
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
