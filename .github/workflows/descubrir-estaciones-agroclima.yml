name: Descubrir estaciones AgroClima

on:
  workflow_dispatch:
    inputs:
      min_id:
        description: ID inicial a explorar
        required: true
        default: "1400"
      max_id:
        description: ID final a explorar
        required: true
        default: "1700"
  push:
    branches:
      - "research/agroclima-station-catalog"
    paths:
      - "scripts/descubrir_estaciones_agroclima.py"
      - ".github/workflows/descubrir-estaciones-agroclima.yml"
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: write

concurrency:
  group: agroclima-station-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip requests==2.32.3
      - name: Explorar páginas públicas y validar estaciones
        env:
          MIN_ID: ${{ inputs.min_id || '1400' }}
          MAX_ID: ${{ inputs.max_id || '1700' }}
        run: |
          python scripts/descubrir_estaciones_agroclima.py \
            --min-id "$MIN_ID" \
            --max-id "$MAX_ID" \
            --workers 4
      - name: Guardar inventario en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/agroclima/estaciones.json datos/agroclima/estaciones.csv
          if git diff --cached --quiet; then
            echo "El inventario no tuvo cambios."
          else
            git commit -m "Update AgroClima station inventory"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Publicar artefacto de respaldo
        uses: actions/upload-artifact@v4
        with:
          name: agroclima-station-inventory
          path: datos/agroclima/
          if-no-files-found: error
          retention-days: 30
