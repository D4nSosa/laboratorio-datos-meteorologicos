name: Publicar laboratorio en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publicar-pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar archivos publicados
        run: |
          test -s docs/index.html
          test -s docs/graficos/precipitacion_anual_era5.svg
          test -s docs/graficos/climatologia_mensual_era5.svg
          test -s docs/datos/precipitacion_anual_era5.csv
          test -s docs/datos/climatologia_mensual_era5.csv
          test -s docs/datos/metadatos_era5.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("docs")
          with (root / "datos/precipitacion_anual_era5.csv").open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 35, f"Se esperaban 35 años, se encontraron {len(rows)}"
          assert [int(r["anio"]) for r in rows] == list(range(1991, 2026))
          with (root / "datos/climatologia_mensual_era5.csv").open(encoding="utf-8", newline="") as f:
              monthly = list(csv.DictReader(f))
          assert len(monthly) == 12
          assert [int(r["mes"]) for r in monthly] == list(range(1, 13))
          metadata = json.loads((root / "datos/metadatos_era5.json").read_text(encoding="utf-8"))
          assert metadata["dataset"] == "ERA5"
          assert metadata["periodo"] == {"inicio": "1991-01-01", "fin": "2025-12-31"}
          html = (root / "index.html").read_text(encoding="utf-8")
          for asset in ["graficos/precipitacion_anual_era5.svg", "graficos/climatologia_mensual_era5.svg", "datos/precipitacion_anual_era5.csv", "datos/climatologia_mensual_era5.csv", "datos/metadatos_era5.json"]:
              assert asset in html, f"El HTML no enlaza {asset}"
          print("Sitio estático validado: HTML, gráficos, 35 años, 12 meses y metadatos.")
          PY
      - name: Cargar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
