name: Publicar laboratorio en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publicar-pages.yml"
      - "datos/fuentes-externas/inta-siga/analisis-cobertura.json"
      - "datos/fuentes-externas/inta-siga/estaciones-cobertura.csv"
      - "datos/fuentes-externas/inta-siga/precipitacion-anual-estaciones.csv"
      - "datos/fuentes-externas/corrientes/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages para despliegue con Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publicar resultados del análisis INTA-SIGA
        run: |
          mkdir -p docs/datos/inta-siga
          cp datos/fuentes-externas/inta-siga/analisis-cobertura.json docs/datos/inta-siga/
          cp datos/fuentes-externas/inta-siga/estaciones-cobertura.csv docs/datos/inta-siga/
          cp datos/fuentes-externas/inta-siga/precipitacion-anual-estaciones.csv docs/datos/inta-siga/
          mkdir -p docs/datos/fuentes-externas/corrientes
          cp datos/fuentes-externas/corrientes/rainfall-daily.csv docs/datos/fuentes-externas/corrientes/
          cp datos/fuentes-externas/corrientes/qa-summary.json docs/datos/fuentes-externas/corrientes/
      - name: Validar estructura pública
        run: |
          test -s docs/index.html
          test -s docs/datos/precipitacion_anual_era5.csv
          test -s docs/graficos/precipitacion_anual_era5.svg
          test -s docs/datos/inta-siga/analisis-cobertura.json
          test -s docs/datos/inta-siga/estaciones-cobertura.csv
          test -s docs/datos/inta-siga/precipitacion-anual-estaciones.csv
          test -s docs/explorador-interactivo.html
          test -s docs/datos/fuentes-externas/corrientes/rainfall-daily.csv
          test -s docs/datos/fuentes-externas/corrientes/qa-summary.json
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
