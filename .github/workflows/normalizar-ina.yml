name: Normalizar catálogos INA DSIyAH

on:
  push:
    branches:
      - "data/initial-radiosonde-inventory-2026-11-07"
    paths:
      - ".github/workflows/normalizar-ina.yml"
      - "scripts/normalizar_ina_catalogos.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalizar-ina
  cancel-in-progress: false

jobs:
  normalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rama aislada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalizar catálogos
        run: python scripts/normalizar_ina_catalogos.py

      - name: Guardar tablas normalizadas
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/fuentes-externas/hidrologia/ina-dsiyah/catalogos
          git commit -m "data: normalize INA DSIyAH catalog tables"
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
