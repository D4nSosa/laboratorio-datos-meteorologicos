name: Validar interfaz estática

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/validar-sitio-estatico.yml"
      - "datos/fuentes-externas/inta-siga/**"
      - "datos/fuentes-externas/corrientes/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/validar-sitio-estatico.yml"
      - "datos/fuentes-externas/inta-siga/analisis-cobertura.json"
      - "datos/fuentes-externas/inta-siga/estaciones-cobertura.csv"
      - "datos/fuentes-externas/inta-siga/precipitacion-anual-estaciones.csv"
      - "datos/fuentes-externas/corrientes/**"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar dependencias de análisis
        run: python -m pip install -r requirements.txt
      - name: Regenerar serie mensual ERA5
        run: python investigaciones/01-precipitacion-virasoro/scripts/descargar_era5.py
      - name: Preparar datos dinámicos de la interfaz
        run: |
          mkdir -p docs/datos/inta-siga
          cp datos/fuentes-externas/inta-siga/analisis-cobertura.json docs/datos/inta-siga/
          cp datos/fuentes-externas/inta-siga/estaciones-cobertura.csv docs/datos/inta-siga/
          cp datos/fuentes-externas/inta-siga/precipitacion-anual-estaciones.csv docs/datos/inta-siga/
          cp datos/fuentes-externas/inta-siga/estaciones.json docs/datos/inta-siga/
          cp datos/fuentes-externas/inta-siga/estaciones-observaciones.csv.gz docs/datos/inta-siga/
          mkdir -p docs/datos/fuentes-externas/corrientes
          cp datos/fuentes-externas/corrientes/rainfall-daily.csv docs/datos/fuentes-externas/corrientes/
          cp datos/fuentes-externas/corrientes/qa-summary.json docs/datos/fuentes-externas/corrientes/
          test -s docs/datos/precipitacion_mensual_era5.csv
          test -s docs/datos/fuentes-externas/corrientes/rainfall-daily.csv
          test -s docs/datos/fuentes-externas/corrientes/qa-summary.json
      - name: Validar HTML, gráficos y datasets
        run: |
          node --check docs/assets/js/smn-integracion.js
          node --check docs/assets/js/laboratorio-nacional.js
          python - <<'PY'
          import csv, json
          from html.parser import HTMLParser
          from pathlib import Path
          root = Path("docs")
          html_path = root / "index.html"
          explorer_path = root / "explorador-interactivo.html"
          explorer = explorer_path.read_text(encoding="utf-8")
          assert 'data-view="corrientes"' in explorer, "Falta navegación al explorador provincial"
          assert 'id="corrientes"' in explorer, "Falta sección integrada de Corrientes"
          assert "initCorrientes()" in explorer, "Falta inicialización de datos diarios"
          assert 'data-view="national-lab"' in explorer and 'id="national-lab"' in explorer
          assert "assets/js/laboratorio-nacional.js" in explorer
          assert "assets/js/smn-integracion.js" in explorer
          assert 'id="smn-map"' in explorer and 'id="smn-alert-list"' in explorer
          assert 'id="smn-compare-station"' in explorer and 'id="smn-compare-run"' in explorer
          assert 'id="smn-compare-chart"' in explorer and 'id="smn-compare-download"' in explorer
          assert "getStationTemperature" in (root / "assets/js/smn-integracion.js").read_text(encoding="utf-8")
          assert "era5_land" in (root / "assets/js/smn-integracion.js").read_text(encoding="utf-8")
          assert 'id="smn-variable-name"' in explorer and 'id="smn-variable-run"' in explorer
          assert "discoverVariables" in (root / "assets/js/smn-integracion.js").read_text(encoding="utf-8")
          assert (root / "assets/js/smn-integracion.js").exists()
          assert "assets/css/laboratorio-nacional.css" in explorer
          assert (root / "assets/js/laboratorio-nacional.js").exists()
          assert (root / "assets/css/laboratorio-nacional.css").exists()
          assert (root / "datos/inta-siga/estaciones.json").exists()
          assert (root / "datos/inta-siga/estaciones-observaciones.csv.gz").stat().st_size > 1000000
          html = html_path.read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]; self.lang=False
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if tag == "html" and attrs.get("lang") == "es": self.lang=True
                  for key in ("href", "src"):
                      val=attrs.get(key, "")
                      if val and not val.startswith(("http://", "https://", "#", "mailto:")):
                          self.refs.append(val)
          parser=Checker(); parser.feed(html); parser.close()
          assert parser.lang, "Falta lang=es"
          for ref in parser.refs:
              target=(root / ref.split("#",1)[0]).resolve()
              assert target.is_relative_to(root.resolve()), f"Ruta fuera de docs: {ref}"
              assert target.exists(), f"Enlace local roto: {ref}"
          with (root / "datos/precipitacion_anual_era5.csv").open(encoding="utf-8", newline="") as f:
              annual=list(csv.DictReader(f))
          assert len(annual)==35 and [int(r["anio"]) for r in annual]==list(range(1991,2026))
          with (root / "datos/climatologia_mensual_era5.csv").open(encoding="utf-8", newline="") as f:
              monthly=list(csv.DictReader(f))
          assert len(monthly)==12 and [int(r["mes"]) for r in monthly]==list(range(1,13))
          with (root / "datos/precipitacion_mensual_era5.csv").open(encoding="utf-8", newline="") as f:
              monthly_series=list(csv.DictReader(f))
          assert len(monthly_series)==420 and len({(r["anio"],r["mes"]) for r in monthly_series})==420
          metadata=json.loads((root / "datos/metadatos_era5.json").read_text(encoding="utf-8"))
          assert metadata["dataset"]=="ERA5" and metadata["periodo"]=={"inicio":"1991-01-01","fin":"2025-12-31"}
          with (root / "datos/fuentes-externas/corrientes/rainfall-daily.csv").open(encoding="utf-8", newline="") as f:
              corrientes=list(csv.DictReader(f))
          assert len(corrientes)==5186, f"Cantidad inesperada de filas diarias Corrientes: {len(corrientes)}"
          assert all(r["date"] and r["department"] and float(r["rainfall_mm"])>=0 for r in corrientes)
          print(f"Sitio validado: {len(parser.refs)} referencias locales, 35 años, 420 meses, 12 meses de climatología y {len(corrientes)} filas provinciales.")
          PY
